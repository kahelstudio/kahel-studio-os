<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Template Preview — Kahel Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0F0E0C; color: #E8E4DC; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 220px; min-width: 220px; background: #1A1916; display: flex; flex-direction: column; border-right: 1px solid #2A2825; }
    .sidebar-header { padding: 18px 16px 14px; border-bottom: 1px solid #2A2825; }
    .sidebar-logo { font-size: 11px; font-weight: 700; color: #FF5300; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
    .sidebar-title { font-size: 13px; font-weight: 600; color: #E8E4DC; }
    .sidebar-sub { font-size: 11px; color: #6B6860; margin-top: 1px; }
    .template-list { flex: 1; overflow-y: auto; padding: 8px; }
    .template-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background 0.12s; margin-bottom: 2px; }
    .template-item:hover { background: #232220; }
    .template-item.active { background: #2A2825; }
    .template-item.active .t-name { color: #FF5300; }
    .t-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .t-info { min-width: 0; }
    .t-name { font-size: 12px; font-weight: 500; color: #E8E4DC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.12s; }
    .t-type { font-size: 11px; color: #6B6860; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; transition: margin-right 0.25s ease; }
    .main.panel-open { margin-right: 340px; }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #1A1916; border-bottom: 1px solid #2A2825; flex-shrink: 0; gap: 12px; }
    .toolbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .toolbar-name { font-size: 14px; font-weight: 500; color: #E8E4DC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar-badge { font-size: 11px; color: #A8A69E; background: #232220; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.12s; white-space: nowrap; }
    .btn-orange { background: #FF5300; color: white; }
    .btn-orange:hover { background: #E64A00; }
    .btn-orange:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: #A8A69E; border: 1px solid #2A2825; }
    .btn-ghost:hover { background: #232220; color: #E8E4DC; }

    /* Preview */
    .preview-wrap { flex: 1; overflow: hidden; background: #ECEAE4; }
    .preview-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6B6860; gap: 8px; }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 14px; }

    /* Send panel */
    .send-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 340px; background: #1A1916; border-left: 1px solid #2A2825; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease; z-index: 50; }
    .send-panel.open { transform: translateX(0); }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid #2A2825; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .panel-header h2 { font-size: 14px; font-weight: 600; color: #E8E4DC; }
    .close-btn { background: none; border: none; color: #6B6860; cursor: pointer; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 20px; line-height: 1; }
    .close-btn:hover { background: #232220; color: #E8E4DC; }
    .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
    .panel-footer { padding: 14px 20px; border-top: 1px solid #2A2825; flex-shrink: 0; }

    .field { margin-bottom: 18px; }
    .field > label { display: block; font-size: 11px; font-weight: 600; color: #A8A69E; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 7px; }
    .field input[type="text"], .field input[type="email"], .field input[type="password"] {
      width: 100%; background: #0F0E0C; border: 1px solid #2A2825; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; color: #E8E4DC; outline: none;
      transition: border-color 0.15s; font-family: inherit;
    }
    .field input:focus { border-color: #FF5300; }
    .field input::placeholder { color: #4A4845; }
    .key-row { display: flex; gap: 6px; }
    .key-row input { flex: 1; }
    .btn-sm { padding: 8px 10px; }

    .recipients { display: flex; flex-direction: column; gap: 6px; }
    .rcpt-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #0F0E0C; border-radius: 8px; border: 1px solid #2A2825; cursor: pointer; transition: border-color 0.12s; }
    .rcpt-row:hover { border-color: #3A3835; }
    .rcpt-row input[type="checkbox"] { accent-color: #FF5300; width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
    .rcpt-email { font-size: 12px; color: #E8E4DC; cursor: pointer; user-select: none; }

    .divider { height: 1px; background: #2A2825; margin: 18px 0; }

    .tpl-pill { background: #0F0E0C; border: 1px solid #2A2825; border-radius: 8px; padding: 10px 12px; }
    .tpl-pill-label { font-size: 10px; font-weight: 600; color: #6B6860; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px; }
    .tpl-pill-name { font-size: 13px; color: #E8E4DC; }

    .hint { font-size: 11px; color: #6B6860; margin-top: 5px; line-height: 1.5; }

    /* Toast */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #232220; border: 1px solid #2A2825; padding: 10px 16px; border-radius: 10px; font-size: 13px; color: #E8E4DC; display: flex; align-items: center; gap: 8px; z-index: 200; opacity: 0; transition: all 0.2s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: #22C55E; }
    .toast.error { border-color: #EF4444; }
    .toast-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .toast.success .toast-dot { background: #22C55E; }
    .toast.error .toast-dot { background: #EF4444; }

    .full-btn { width: 100%; justify-content: center; padding: 11px; font-size: 14px; font-weight: 600; border-radius: 10px; }
  </style>
</head>

    let currentKey = null;
    let panelOpen = false;

    function getTemplateHtml(key) {
      return document.getElementById('tpl-' + key).textContent.trim();
    }

    function applyVars(html, vars) {
      let out = html;
      for (const [token, val] of Object.entries(vars)) {
        out = out.split(token).join(val);
      }
      // Replace remote logo with local SVG data URI for preview
      out = out.replace(
        'https://dashboard.kahelstudio.com/kahelstudio-logo-email.png',
        LOGO_DATA_URI
      );
      return out;
    }

    function renderSidebar() {
      const list = document.getElementById('templateList');
      list.innerHTML = Object.entries(TEMPLATES).map(([key, t]) => `
        <div class="template-item ${key === currentKey ? 'active' : ''}" onclick="selectTemplate('${key}')">
          <div class="t-icon" style="background:${t.iconBg}">${t.icon}</div>
          <div class="t-info">
            <div class="t-name">${t.name}</div>
            <div class="t-type">${t.type}</div>
          </div>
        </div>
      `).join('');
    }

    function selectTemplate(key) {
      currentKey = key;
      const t = TEMPLATES[key];
      renderSidebar();

      document.getElementById('toolbarName').textContent = t.name;
      document.getElementById('toolbarType').textContent = t.type;
      document.getElementById('panelTplName').textContent = t.name;

      const html = applyVars(getTemplateHtml(key), t.vars);
      const frame = document.getElementById('previewFrame');
      frame.srcdoc = html;
      frame.style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';
    }

    function togglePanel() {
      panelOpen = !panelOpen;
      document.getElementById('sendPanel').classList.toggle('open', panelOpen);
      document.getElementById('main').classList.toggle('panel-open', panelOpen);
    }

    function toggleKeyVis() {
      const input = document.getElementById('apiKey');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function sendTest() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) { showToast('Enter your Resend API key first.', 'error'); return; }
      if (!currentKey) { showToast('Select a template first.', 'error'); return; }

      const checked = [...document.querySelectorAll('input[name="rcpt"]:checked')].map(el => el.value);
      const custom = document.getElementById('customRcpt').value.trim();
      if (custom) checked.push(custom);
      if (checked.length === 0) { showToast('Select at least one recipient.', 'error'); return; }

      localStorage.setItem('ks_resend_key', apiKey);

      const t = TEMPLATES[currentKey];
      const html = applyVars(getTemplateHtml(currentKey), t.vars);

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await fetch('https://api.resend.com/emails', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            from: document.getElementById('fromField').value.trim(),
            to: checked,
            subject: t.subject,
            html,
          }),
        });

        if (res.ok) {
          showToast(`Sent to ${checked.length} recipient${checked.length !== 1 ? 's' : ''} ✓`, 'success');
        } else {
          const body = await res.json().catch(() => ({}));
          showToast(body.message || `Resend error ${res.status}`, 'error');
        }
      } catch (e) {
        showToast('Network error — check console for details.', 'error');
        console.error('[email-preview] send error:', e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Test Email';
      }
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.className = `toast show ${type}`;
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // Init
    const saved = localStorage.getItem('ks_resend_key');
    if (saved) document.getElementById('apiKey').value = saved;
    renderSidebar();
    selectTemplate('confirm-signup');
  </script>
