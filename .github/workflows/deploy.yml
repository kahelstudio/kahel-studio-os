name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm run typecheck

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm audit --audit-level=high

  visual_tests:
    name: Visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      KAHEL_AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npm run cf:check
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .open-next/
          retention-days: 1
          include-hidden-files: true

  validate_migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 30
    services:
      docker:
        image: docker:27.4-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npx supabase start --ignore-health-check
      - run: npx supabase db reset --local
      - run: npx supabase migration list --local
      - run: npx supabase db lint --local --fail-on error

  # ── Staging ──────────────────────────────────────────────

  migrate_staging:
    name: Migrate staging DB
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [build, validate_migrations]
    environment:
      name: staging
      url: https://kahel.studio
    concurrency: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: |
          if [[ "$SUPABASE_PROJECT_REF" != "oscoovosnnuqsuhevmia" ]]; then
            echo "Refusing to seed an unapproved Supabase project."
            exit 1
          fi
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --include-seed --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

  deploy_staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [migrate_staging]
    environment:
      name: staging
      url: https://kahel.studio
    concurrency: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .open-next/
      - run: npm ci
      - run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            case "$line" in
              SUPABASE_URL=*|SUPABASE_PUBLISHABLE_KEY=*) continue ;;
              *) printf '%s\n' "$line" ;;
            esac
          done <<< "$WANGLER_SECRETS" > /tmp/wrangler-secrets.env
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_PUBLISHABLE_KEY" \
            >> /tmp/wrangler-secrets.env
        env:
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          WANGLER_SECRETS: ${{ secrets.STAGING_CLOUDFLARE_WORKER_SECRETS }}
      - run: |
          npx wrangler deploy --env staging --keep-vars
          npx wrangler secret bulk /tmp/wrangler-secrets.env --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify_staging:
    name: Verify staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [deploy_staging]
    environment:
      name: staging
      url: https://kahel.studio
    concurrency: staging
    timeout-minutes: 5
    steps:
      - run: |
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error --max-time 20 "https://kahel.studio/api/staff/session?deployment_check=$attempt")"
            if jq -e '
              .configured == true and
              (.configurationChecks | all(. == true))
            ' <<< "$response" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  # ── Production ───────────────────────────────────────────

  migrate_production:
    name: Migrate production DB
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build, validate_migrations]
    environment:
      name: production
      url: https://kahelstudio.com
    concurrency: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: |
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}

  deploy_production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [migrate_production]
    environment:
      name: production
      url: https://kahelstudio.com
    concurrency: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "npm" }
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .open-next/
      - run: npm ci
      - run: npx wrangler deploy --env production --keep-vars
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify_production:
    name: Verify production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [deploy_production]
    environment:
      name: production
      url: https://kahelstudio.com
    concurrency: production
    timeout-minutes: 5
    steps:
      - run: |
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error --max-time 20 "https://kahelstudio.com/api/staff/session?deployment_check=$attempt")"
            if jq -e '
              .configured == true and
              (.configurationChecks | all(. == true))
            ' <<< "$response" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
