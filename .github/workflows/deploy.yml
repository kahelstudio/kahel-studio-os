name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm run typecheck

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm test

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm audit --audit-level=high

  visual_tests:
    name: Visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      KAHEL_AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npm run cf:check
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .open-next/
          retention-days: 1
          include-hidden-files: true

  validate_migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - name: Log in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-pull Supabase images from ECR Public
        run: |
          for img in \
            postgres:17.6.1.159 \
            gotrue:v2.195.0 \
            kong:2.8.1 \
            postgres-meta:v0.98.0 \
            edge-runtime:v1.74.3 \
            logflare:1.50.2 \
            realtime:v2.129.0 \
            storage-api:v1.69.11 \
            "studio:2026.08.17-sha-0c1da8f" \
            supavisor:2.9.7 \
            mailpit:v1.30.2 \
            "vector:0.53.0-alpine" \
            postgrest:v16.1 \
            migra:3.0.1663481299
          do
            docker pull "public.ecr.aws/supabase/$img" \
              && docker tag "public.ecr.aws/supabase/$img" "supabase/$img" \
              || true
          done
      - run: npx supabase start --ignore-health-check
      - run: npx supabase db reset --local
      - run: npx supabase migration list --local
      - run: npx supabase db lint --local --fail-on error
      - run: npx supabase test db --local

  # ── Staging ──────────────────────────────────────────────

  migrate_staging:
    name: Migrate staging DB
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [build, validate_migrations]
    environment:
      name: staging
      url: https://kahel.studio
    concurrency: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: |
          if [[ "$SUPABASE_PROJECT_REF" != "oscoovosnnuqsuhevmia" ]]; then
            echo "Refusing to seed an unapproved Supabase project."
            exit 1
          fi
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --include-all --include-seed --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

  deploy_staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [migrate_staging]
    environment:
      name: staging
      url: https://kahel.studio
    concurrency: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .open-next/
      - run: npm ci
      - run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            case "$line" in
              SUPABASE_URL=*|SUPABASE_PUBLISHABLE_KEY=*) continue ;;
              *) printf '%s\n' "$line" ;;
            esac
          done <<< "$WANGLER_SECRETS" > /tmp/wrangler-secrets.env
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_PUBLISHABLE_KEY" \
            >> /tmp/wrangler-secrets.env
        env:
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          WANGLER_SECRETS: ${{ secrets.STAGING_CLOUDFLARE_WORKER_SECRETS }}
      - run: |
          npx wrangler deploy --env staging --keep-vars
          npx wrangler secret bulk /tmp/wrangler-secrets.env --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify_staging:
    name: Verify staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: [deploy_staging]
    environment:
      name: staging
      url: https://kahel.studio
    concurrency: staging
    timeout-minutes: 5
    steps:
      - run: |
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error --max-time 20 "https://kahel.studio/api/staff/session?deployment_check=$attempt")"
            if jq -e '
              .configured == true and
              (.configurationChecks | all(. == true))
            ' <<< "$response" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  # ── Production ───────────────────────────────────────────

  migrate_production:
    name: Migrate production DB
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, validate_migrations, unit_tests]
    environment:
      name: production
      url: https://kahelstudio.com
    concurrency: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - run: npm ci
      - run: |
          if [[ "$SUPABASE_PROJECT_REF" != "dblmhfsctrhyxxulvvqi" ]]; then
            echo "Refusing to migrate an unexpected production Supabase project."
            exit 1
          fi
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}

  deploy_production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [migrate_production]
    environment:
      name: production
      url: https://kahelstudio.com
    concurrency: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "npm" }
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .open-next/
      - run: npm ci
      - run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            case "$line" in
              SUPABASE_URL=*|SUPABASE_PUBLISHABLE_KEY=*) continue ;;
              *) printf '%s\n' "$line" ;;
            esac
          done <<< "$WANGLER_SECRETS" > /tmp/wrangler-secrets.env
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_PUBLISHABLE_KEY" \
            >> /tmp/wrangler-secrets.env
        env:
          SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          WANGLER_SECRETS: ${{ secrets.PRODUCTION_CLOUDFLARE_WORKER_SECRETS }}
      - run: npx wrangler secret bulk /tmp/wrangler-secrets.env --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy --env production --keep-vars
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify_production:
    name: Verify production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [deploy_production]
    environment:
      name: production
      url: https://kahelstudio.com
    concurrency: production
    timeout-minutes: 5
    steps:
      - run: |
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error --max-time 20 "https://kahelstudio.com/api/staff/session?deployment_check=$attempt")"
            if jq -e '
              .configured == true and
              (.configurationChecks | all(. == true))
            ' <<< "$response" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: |
          webhook_secret="$(node -e '
            const line = process.env.WANGLER_SECRETS.split(/\r?\n/).find((entry) => entry.startsWith("PAYMONGO_WEBHOOK_SECRET="));
            if (line) process.stdout.write(line.slice(line.indexOf("=") + 1));
          ')"
          if [[ -z "$webhook_secret" ]]; then
            echo "PAYMONGO_WEBHOOK_SECRET not configured — skipping webhook check."
            exit 0
          fi
          body='{"data":{"id":"deployment_check","type":"event","attributes":{"type":"deployment.check","data":{"id":"deployment_check","attributes":{}}}}}'
          signature="$(BODY="$body" WEBHOOK_SECRET="$webhook_secret" node -e '
            const { createHmac } = require("node:crypto");
            process.stdout.write(createHmac("sha256", process.env.WEBHOOK_SECRET).update(process.env.BODY).digest("hex"));
          ')"
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Paymongo-Signature: $signature" \
            --data "$body" \
            "https://kahelstudio.com/api/paymongo/webhook")"
          jq -e '.received == true' <<< "$response" > /dev/null
        env:
          WANGLER_SECRETS: ${{ secrets.PRODUCTION_CLOUDFLARE_WORKER_SECRETS }}
